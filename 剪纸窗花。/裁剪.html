<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>清空图形内部图片 - 最终生效版</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        canvas {
            border: 2px solid #333;
            background: white;
            cursor: crosshair;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .controls {
            margin: 20px 0;
        }

        button {
            padding: 10px 20px;
            margin: 0 10px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background: #007bff;
            color: white;
        }

        button:hover {
            background: #0056b3;
        }
    </style>
    <style type="text/css">
        .qa-sdk-wrapper {
            position: fixed;
            width: 400px;
            right: -600px;
            max-height: 530px;
            overflow: hidden;
            border-radius: 4px;
            box-shadow: 0px 0px 8px 0px rgba(0, 0, 0, 0.1);
            transition: all 0.5s ease-in-out;
            background: #fff;
        }

        .qa-sdk-close-btn {
            display: inline-block;
            width: 18px;
            height: 18px;
            cursor: pointer;
            position: absolute;
            top: 16px;
            right: 16px;
        }

        .qa-sdk-close-btn:hover {
            border-radius: 50%;
            background-color: #d5d9df;
        }

        #qa-sdk-iframe {
            width: 400px;
        }

        @media (min-width: 1024px) and (max-width: 1366px) {
            .qa-sdk-wrapper {
                width: 356px;
            }

            #qa-sdk-iframe {
                width: 356px;
            }
        }
    </style>
    <style id="ai-assist-webType-style">
        .ai-assist-highlight {
            background: yellow;
        }

        @media print {

            #ai-assist-root-bangs,
            #ai-assist-root-bilibili,
            #ai-assist-root-new {
                display: none !important;
            }
        }
    </style>
</head>

<body>


    <canvas id="drawingCanvas" width="400" height="800"></canvas>

    <!-- 新增：操作按钮区域 -->
    <div class="controls">
        <button id="undoButton">撤销</button>
        <button id="clearAllButton">清空</button>
    </div>

    <script>
        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d');

        let isDrawing = false;
        let startX = 0;
        let startY = 0;
        let allPoints = []; // 当前绘制的路径点
        let clippedPaths = []; // 记录所有已清空内部的路径
        let strokeColor = 'black';
        let fillOpacity = 0.2;
        let brushSize = 5;
        let backgroundImage = null;
        let totalClippedArea = 0; // 总裁剪面积
        const canvasArea = canvas.width * canvas.height; // 画布总面积
        const requiredAreaRatio = 1 / 4; // 要求的面积比例

        // 计算多边形面积（Shoelace公式）
        function calculatePolygonArea(points) {
            let area = 0;
            const n = points.length;

            for (let i = 0; i < n; i++) {
                const j = (i + 1) % n;
                area += points[i][0] * points[j][1];
                area -= points[j][0] * points[i][1];
            }

            return Math.abs(area) / 2;
        }

        // 更新裁剪进度并存储到localStorage
        function updateClippingProgress() {
            // 计算所有已裁剪路径的总面积
            totalClippedArea = clippedPaths.reduce((total, path) => {
                return total + calculatePolygonArea(path);
            }, 0);

            // 计算裁剪进度比例
            const progressRatio = totalClippedArea / canvasArea;
            const isCompleted = progressRatio >= requiredAreaRatio;

            // 存储到localStorage，供index.html访问
            try {
                localStorage.setItem('clippingProgress', JSON.stringify({
                    ratio: progressRatio,
                    isCompleted: isCompleted,
                    timestamp: Date.now()
                }));
            } catch (e) {
                console.error('无法存储裁剪进度到localStorage:', e);
            }
        }

        // 初始化
        function initCanvas() {
            ctx.strokeStyle = strokeColor;
            ctx.fillStyle = `rgba(255, 255, 0, ${fillOpacity})`;
            ctx.lineWidth = brushSize;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            loadBackgroundImage();
            // 初始化localStorage
            try {
                localStorage.setItem('clippingProgress', JSON.stringify({
                    ratio: 0,
                    isCompleted: false,
                    timestamp: Date.now()
                }));
            } catch (e) {
                console.error('无法初始化localStorage:', e);
            }
        }

        // 加载背景图（修复：确保图片加载成功后再绘制）
        function loadBackgroundImage() {
            const img = new Image();
            img.src = '白色虚线.png'; // 确保图片路径正确（和HTML文件同目录）
            // 处理图片加载失败（避免路径错误导致无背景）
            img.onerror = function () {
                alert('背景图加载失败！请检查图片路径是否正确');
                backgroundImage = null;
            };
            img.onload = function () {
                backgroundImage = img;
                // 绘制背景图（覆盖整个Canvas）
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                clippedPaths = [];
            };
        }

        // 开始绘图
        function startDrawing(e) {
            isDrawing = true;
            const [x, y] = getMousePos(canvas, e);
            startX = x;
            startY = y;
            allPoints = [[x, y]];
        }

        // 绘图函数（保持已清空区域空白）
        function draw(e) {
            if (!isDrawing) return;

            const [currentX, currentY] = getMousePos(canvas, e);
            allPoints.push([currentX, currentY]);

            // 1. 重新绘制完整背景图
            if (backgroundImage) {
                ctx.drawImage(backgroundImage, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }

            // 2. 清空所有已记录的裁剪区域（关键：确保内部空白）
            clippedPaths.forEach(path => {
                clearPathInside(path); // 提取独立函数，避免重复代码
            });

            // 3. 绘制当前图形
            drawPath(allPoints, true, true);
        }

        // 结束绘图
        function stopDrawing() {
            isDrawing = false;
        }

        // 核心功能：清空指定路径内部的图片
        function clearPathInside(path) {
            ctx.save();
            // 确保路径是封闭的（手动闭合，避免自动闭合偏差）
            ctx.beginPath();
            ctx.moveTo(path[0][0], path[0][1]);
            path.forEach(([x, y], i) => i > 0 && ctx.lineTo(x, y));
            ctx.closePath(); // 强制闭合路径（关键修复）
            ctx.clip(); // 裁剪范围=路径内部

            // 清空裁剪区域（只清空内部图片）
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.restore();
        }

        // 辅助函数：绘制路径（填充+描边）
        function drawPath(path, isFill, isStroke) {
            ctx.beginPath();
            ctx.moveTo(path[0][0], path[0][1]);
            path.forEach(([x, y], i) => i > 0 && ctx.lineTo(x, y));
            ctx.closePath();
            if (isFill) ctx.fill();
            if (isStroke) ctx.stroke();
        }

        // 清空当前图形内部图片（最终版）
        function clearInsidePath() {
            if (allPoints.length < 3) {
                alert('请先绘制一个封闭图形！');
                return;
            }
            if (!backgroundImage) {
                alert('请先加载背景图！');
                return;
            }

            // 保存当前路径（深拷贝）
            const currentPath = [...allPoints];
            clippedPaths.push(currentPath);

            // 1. 重新绘制背景图（恢复外部图片）
            ctx.drawImage(backgroundImage, 0, 0, canvas.width, canvas.height);

            // 2. 清空所有已记录的路径内部（包括当前路径）
            clippedPaths.forEach(path => clearPathInside(path));

            // 更新裁剪进度
            updateClippingProgress();
        }

        // 获取Canvas内部坐标（不变）
        function getMousePos(canvas, evt) {
            const rect = canvas.getBoundingClientRect();
            return [
                evt.clientX - rect.left,
                evt.clientY - rect.top
            ];
        }

        // 辅助函数：修改线条颜色
        function changeStrokeColor(color) {
            strokeColor = color;
            ctx.strokeStyle = color;
        }

        // 辅助函数：修改填充透明度
        function changeFillOpacity(opacity) {
            fillOpacity = opacity;
            ctx.fillStyle = `rgba(255, 255, 0, ${opacity})`;
        }

        // 辅助函数：修改画笔大小
        function changeBrushSize(size) {
            brushSize = size;
            ctx.lineWidth = size;
        }

        // 新增：撤销上一步裁剪操作
        function undoLastClip() {
            if (clippedPaths.length === 0) {
                alert('没有可撤销的操作！');
                return;
            }

            // 移除最后一个裁剪路径
            clippedPaths.pop();

            // 重新绘制背景图
            if (backgroundImage) {
                ctx.drawImage(backgroundImage, 0, 0, canvas.width, canvas.height);

                // 重新清空剩余的裁剪区域
                clippedPaths.forEach(path => clearPathInside(path));
            }

            // 更新裁剪进度
            updateClippingProgress();
        }

        // 修改：清空所有裁剪操作，保留背景图
        function clearAllClips() {
            if (clippedPaths.length === 0) {
                alert('当前没有裁剪操作！');
                return;
            }

            // 清空所有裁剪路径
            clippedPaths = [];

            // 重新绘制完整背景图
            if (backgroundImage) {
                ctx.drawImage(backgroundImage, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }

            // 更新裁剪进度
            updateClippingProgress();
        }

        // 辅助函数：清空整个画布（包括背景图）
        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            allPoints = [];
            clippedPaths = [];
            backgroundImage = null;
            // 更新裁剪进度
            updateClippingProgress();
        }

        // 事件监听
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);
        canvas.addEventListener('mouseup', clearInsidePath);

        // 新增：按钮事件监听
        document.getElementById('undoButton').addEventListener('click', undoLastClip);
        document.getElementById('clearAllButton').addEventListener('click', clearAllClips);

        // 定期更新进度，确保index.html能及时获取最新进度
        setInterval(updateClippingProgress, 500);

        initCanvas();
    </script>
    <div id="qihooai-assistant-root"></div>
</body>
<div id="shadow-root-ai-zhishiku"></div>
<div id="ai-assist-root-bangs"></div>
<div id="ai-assist-root-new"></div>

</html>
